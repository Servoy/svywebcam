<div [id]="servoyApi().getMarkupId()" #element
  [ngClass]="styleClass"
  class="svy-webcam"
  style="width:100%;height:100%;overflow:hidden">
  @if (!errors().length && !errorAccessDenied() && showWebCam()) {
    <webcam
      (initError)="handleInitError($event)"
      (imageCapture)="handleCapture($event)"
      [trigger]="triggerObservable"
      [width]="width()"
      [height]="height()"
      [imageQuality]="optQuality()"
      [mirrorImage]="optMirror()"
      [videoOptions]="videoOptions()"
      [switchCamera]="switchCameraObservable"
    ></webcam>
  }
  @if (errorAccessDenied()) {
    <div>
      <p>You have denied camera access.</p>
      <p>Look for camera icon around your address bar to change your</p>
    </div>
  }
  @for (error of errors(); track $index) {
    <ul>
      <p>{{error | json}}</p>
    </ul>
  }
</div>
